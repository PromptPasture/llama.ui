<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link
      rel="icon"
      href="%sveltekit.assets%/assets/favicon.ico"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/assets/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/assets/apple-icon-180.png"
    />
    <!-- Overwritten below to match the theme. Declared here, ahead of the
         script, so that it exists by the time the script looks for it. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the stored theme before the first paint. The app itself only
      // reaches switchTheme once it has hydrated, awaited the locale and read
      // IndexedDB, so without this a dark theme arrives as a flash of white.
      // 'auto' is stored as no value at all, which correctly leaves the
      // attribute off and lets the stylesheet's prefers-color-scheme rule win.
      try {
        var storedTheme = localStorage.getItem('theme');
        // 'auto' is normally stored as nothing at all; accept it either way.
        if (storedTheme === 'auto') storedTheme = null;
        if (storedTheme) {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
        // Mirrors THEME_COLORS in src/lib/config/theme.ts, which cannot be
        // imported here — change the two together.
        var prefersDark =
          storedTheme === 'dark' ||
          (!storedTheme &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = prefersDark
          ? '#1d232a'
          : '#ffffff';
      } catch {
        // Storage blocked; the system preference still applies.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
