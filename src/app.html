<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      href="%sveltekit.assets%/assets/favicon.ico"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/assets/favicon.svg"

    <div style="display: contents">%sveltekit.body%</div>
